<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>{{BOOK_TITLE}}</title>
    <meta name="description" content="{{BOOK_DESCRIPTION}}" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{BOOK_TITLE}}" />
    <meta property="og:description" content="{{BOOK_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{BOOK_SITE_URL}}" />
    <meta property="og:image" content="{{BOOK_OG_IMAGE}}" />
    <meta property="og:image:alt" content="{{BOOK_NAME}} by {{BOOK_AUTHOR}} — book cover" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1697" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{BOOK_TITLE}}" />
    <meta name="twitter:description" content="{{BOOK_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{BOOK_OG_IMAGE}}" />
    <meta name="twitter:image:alt" content="{{BOOK_NAME}} by {{BOOK_AUTHOR}} — book cover" />

    <!-- JSON-LD structured data: schema.org/Book -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Book",
      "name": "{{BOOK_NAME}}",
      "author": {
        "@type": "Person",
        "name": "{{BOOK_AUTHOR}}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "{{BOOK_PUBLISHER}}"
      },
      "description": "{{BOOK_DESCRIPTION}}",
      "url": "{{BOOK_SITE_URL}}",
      "image": "{{BOOK_OG_IMAGE}}",
      "inLanguage": "{{BOOK_LANGUAGE}}",
      "genre": "{{BOOK_GENRE}}"
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
